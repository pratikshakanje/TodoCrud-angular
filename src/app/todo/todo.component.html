<h2 class="text-center bg-dark text-white py-2">TODO CRUD</h2>
<div class="container my-5">
    <div class="row">

        <div class="col-md-6">
            <div class="card bg-light">
                <div class="card-body">
                    <h3 class="text-center text-primary">Todo Form</h3>
                    <div class="form-group">
                        <label for="todoName">Enter Todo :</label>
                        <input type="text" class="form-control" #todoName>
                    </div>

                    <div class="form-group">
                        <label for="isCompleted">Is Completed :</label>
                        <select class="form-control" #isCompleted>
                            <option value="">Select Status</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>


                    <button (click)="onAddTodo()" mat-raised-button color="primary" *ngIf="!isInEditMode"
                        class="btn btn-block">Add Todo
                    </button>
                    <button (click)="onUpdateTodo()" mat-raised-button color="warn" *ngIf="isInEditMode"
                        class="btn btn-block">
                        Update Todo
                    </button>
                </div>
            </div>



        </div>
        <div class="col-md-6">

            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between bg-light" *ngFor="let todo of todosArr">
                    <div>
                        <input type="checkbox" [checked]="todo.isCompleted" (change)="onUpdateCheckbox(todo)">
                        <strong class="mx-2">{{todo.todoName}}</strong>
                        <span class="badge" [ngClass]="todo.isCompleted ?  'badge-success':'badge-danger'">
                            {{todo.isCompleted ? 'Completd' : 'Not Completed'}}
                        </span>
                    </div>


                    <div>
                        <button (click)="onEditTodo(todo)" mat-mini-fab color="primary" class="mr-2">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button (click)="onDeleteTodo(todo.todoId)" mat-mini-fab color="warn">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </li>
            </ul>

        </div>
    </div>
</div>
